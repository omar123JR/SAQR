<!--
  SAQR Hardened Wazuh Agent Centralized Configuration (Windows)
  =============================================================
  Mounted at: /var/ossec/etc/shared/default/agent.conf on wazuh.manager
  Pushed automatically to all enrolled Windows agents (e.g., win10-vm).

  Key Engineering Decisions (Important for Thesis Defense):
    1. Tuned <client_buffer> (25,000 events, 1,000 EPS): prevents telemetry drops
       during a high-speed ransomware burst (default 5,000 / 500 EPS drops alerts).
    2. NO report_changes diff archiving on FIM directories: copying modified
       file diffs to disk causes I/O storms during encryption and leaks PII.
    3. whodata="yes" on user folders + C:\SAQR-Test: captures the exact Windows
       Audit PID (syscheck.audit.process.id) for in-place ransomware overwrites
       that never fire Sysmon Event ID 11 or 26.
-->
<agent_config os="Windows">
  <!-- High-throughput anti-drop event buffer -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>25000</queue_size>
    <events_per_second>1000</events_per_second>
  </client_buffer>

  <!-- Telemetry Channel 1: Sysmon Operational (EID 1, 3, 11, 22, 26) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Telemetry Channel 2: PowerShell Script Block Logging (EID 4104)
       Catches fileless shadow-copy deletion (Win32_ShadowCopy.Delete()) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4104]</query>
  </localfile>

  <!-- Narrowly Scoped Real-Time FIM (whodata="yes", NO report_changes) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <file_limit>
      <enabled>yes</enabled>
      <entries>50000</entries>
    </file_limit>

    <!-- Protected user folders + safe graduation lab sandbox -->
    <directories check_all="yes" whodata="yes" recursion_level="4">C:\Users\*\Desktop,C:\Users\*\Documents,C:\Users\*\Downloads,C:\SAQR-Test</directories>

    <!-- Noise and self-feedback exclusions -->
    <ignore>C:\ProgramData\SAQR\Vault</ignore>
    <ignore>C:\Windows\Temp</ignore>
    <ignore type="sregex">(?i)\\AppData\\|\\\.git\\|\\~\$|\.tmp$|\.log$|desktop\.ini$|thumbs\.db$|ntuser\.dat</ignore>

    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>200</max_eps>
    </synchronization>
  </syscheck>
</agent_config>
