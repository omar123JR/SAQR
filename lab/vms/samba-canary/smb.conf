# SAQR Samba Canary Configuration (SMB2+ Lab Share)
# Intentionally exposes a writable `finance` share inside the isolated lab
# so uncontained ransomware WOULD encrypt it — making 50/50 intact files in
# /srv/canary/manifest.sha256 an empirical, non-vacuous proof of 0 lateral spread.

[global]
   workgroup = SAQRLAB
   server string = SAQR Finance Canary Server
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log level = 1
   logging = stdout

[finance]
   comment = SAQR Lateral-Movement Canary Share (50 seeded files)
   path = /srv/canary/finance
   browseable = yes
   writable = yes
   read only = no
   guest ok = yes
   force user = nobody
   create mask = 0666
   directory mask = 0777
