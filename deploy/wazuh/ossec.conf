<!-- SAQR Wazuh Manager v4.14.11 Configuration Snippet (ossec.conf)
     Merge or mount into /var/ossec/etc/ossec.conf inside wazuh.manager -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Wazuh Agent Enrollment Service (TCP/1515) -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
  </auth>

  <!-- Real-Time Integrator Webhook (<200ms) -> SAQR FastAPI Engine (:5000)
       NEVER rely on OpenSearch Indexer Alerting monitors (60s poll breaks <5s MTTD!) -->
  <integration>
    <name>custom-saqr.py</name>
    <hook_url>http://saqr-engine:5000/api/v1/webhooks/wazuh</hook_url>
    <api_key>REPLACE_WITH_SAQR_WEBHOOK_SECRET</api_key>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- Stateless Windows Active Response Commands (no timeout handshake deadlock) -->
  <command>
    <name>saqr-contain</name>
    <executable>saqr-contain.cmd</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <command>
    <name>saqr-unquarantine</name>
    <executable>saqr-unquarantine.cmd</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
</ossec_config>
